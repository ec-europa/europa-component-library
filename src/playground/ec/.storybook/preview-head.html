<style>
  .sb-show-nopreview {
    display: none;
  }
  .sbdocs-content {
    max-width: none !important;
  }
</style>
<script>
  window.global = window;
</script>
<script type="module" src="./duet/duet.esm.js"></script>
<script type="module" src="./scripts/ecl-esm-ec.js"></script>
<script
  defer
  src="https://webtools.europa.eu/load.js"
  type="text/javascript"
></script>
<script>
  document.onreadystatechange = () => {
    if (document.readyState === 'complete') {
      const root = document.getElementById('storybook-root');
      // Add autoinit for specific components
      root.setAttribute('data-ecl-auto-init', 'Tooltip');
      // Add ecl class to ensure that default css is working well
      root.classList.add('ecl');
    }
  };
  setTimeout(() => {
    const doc = window.parent.document;
    const open = doc.querySelector('[title="Open addon panel"]');
    if (open) {
      open.click();
    }
  }, 200);
</script>
