name: CI

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - '*-dev'

jobs:
  semantic:
    name: Validate PR title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install pnpm
        run: npm install -g pnpm@10.9.0
      - name: Test
        run: ./scripts/audit.sh
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install pnpm
        run: npm install -g pnpm@10.9.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build icons
        run: pnpm build:icons
      - name: Build presets
        run: pnpm build:presets
      - name: Test
        run: pnpm test
  size:
    name: size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install pnpm
        run: npm install -g pnpm@10.9.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build icons
        run: pnpm build:icons
      - name: Build presets
        run: pnpm dist:presets
      - name: Test
        run: pnpm size-limit
  deploy-pull-request-preview:
    name: deploy preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install pnpm
        run: npm install -g pnpm@10.9.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build icons
        run: pnpm build:icons
      - name: Package application
        run: pnpm dist
      - uses: jpoehnelt/reusable-workspace/save@v1
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v2.0
        with:
          alias: ecl-preview-${{ github.event.number }}
          publish-dir: 'dist/website'
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NETLIFY: true
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
  chromatic-ec:
    if: ${{ github.event.pull_request && (contains(github.event.pull_request.labels.*.name, 'chromatic') || contains(github.event.pull_request.labels.*.name, 'chromatic-ec')) }}
    name: Run Chromatic for EC
    needs: deploy-pull-request-preview
    runs-on: ubuntu-latest
    steps:
      - uses: jpoehnelt/reusable-workspace/restore@v1
      - uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: dist/website/playground/ec
  chromatic-eu:
    name: Run Chromatic for EU
    if: ${{ github.event.pull_request && (contains(github.event.pull_request.labels.*.name, 'chromatic') || contains(github.event.pull_request.labels.*.name, 'chromatic-eu')) }}
    needs: deploy-pull-request-preview
    runs-on: ubuntu-latest
    steps:
      - uses: jpoehnelt/reusable-workspace/restore@v1
      - uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN_EU }}
          storybookBuildDir: dist/website/playground/eu
  deploy-release-branch:
    name: deploy release branch
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && endsWith(github.ref, '-dev')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install pnpm
        run: npm install -g pnpm@10.9.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build icons
        run: pnpm build:icons
      - name: Package application
        run: pnpm dist
      - uses: jpoehnelt/reusable-workspace/save@v1
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v2.0
        with:
          alias: ${{ github.ref_name }}
          publish-dir: 'dist/website'
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NETLIFY: true
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
  chromatic-ec-dev:
    name: Run Chromatic for EC on release branch
    needs: deploy-release-branch
    runs-on: ubuntu-latest
    steps:
      - uses: jpoehnelt/reusable-workspace/restore@v1
      - uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: dist/website/playground/ec
  chromatic-eu-dev:
    name: Run Chromatic for EU on release branch
    needs: deploy-release-branch
    runs-on: ubuntu-latest
    steps:
      - uses: jpoehnelt/reusable-workspace/restore@v1
      - uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN_EU }}
          storybookBuildDir: dist/website/playground/eu
